<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Default Cloak Settings -->
  <title>Dashboard</title>
  <link id="dynamic-favicon" rel="icon" type="image/png" href="https://www.google.com/favicon.ico" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6366f1;
      --secondary: #a855f7;
      --bg-dark: #0b0f1a;
      --card-bg: rgba(23, 29, 45, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 95%;
      max-width: 800px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 48px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .header { text-align: center; margin-bottom: 40px; }
    
    .header h1 {
      font-size: 2.8rem;
      letter-spacing: -1px;
      margin-bottom: 8px;
      background: linear-gradient(to right, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p { color: #94a3b8; font-size: 1.1rem; }

    /* Modern Search Bar */
    .search-container {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 8px 8px 8px 24px;
      transition: all 0.3s ease;
      margin-bottom: 40px;
    }

    .search-container:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
      transform: translateY(-2px);
    }

    .proxy-input {
      flex: 1;
      background: none;
      border: none;
      color: white;
      font-size: 1.1rem;
      outline: none;
      padding: 12px 0;
    }

    .proxy-button {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .proxy-button:hover { opacity: 0.9; }

    /* Cloaking Section */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
    }

    .card h3 { font-size: 0.9rem; color: #818cf8; text-transform: uppercase; margin-bottom: 16px; letter-spacing: 1px; }

    .select-style, .input-style {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--glass-border);
      color: #e2e8f0;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      outline: none;
    }

    @media (max-width: 640px) {
      .settings-grid { grid-template-columns: 1fr; }
      .search-container { flex-direction: column; padding: 12px; gap: 12px; }
      .proxy-input { width: 100%; text-align: center; }
      .proxy-button { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Titanium</h1>
      <p>Secure, private, and undetectable browsing.</p>
    </div>

    <form class="search-container" id="proxy-form">
      <input type="text" id="url-input" class="proxy-input" placeholder="Search Google or type a URL..." autocomplete="off">
      <button type="submit" class="proxy-button">Launch</button>
    </form>

    <div class="settings-grid">
      <!-- Quick Presets -->
      <div class="card">
        <h3>App Disguises</h3>
        <select id="cloak-presets" class="select-style" onchange="applyPreset()">
          <option value="default">Select a Disguise...</option>
          <option value="google">Google Search</option>
          <option value="classroom">Google Classroom</option>
          <option value="drive">Google Drive</option>
          <option value="canvas">Canvas LMS</option>
          <option value="zoom">Zoom</option>
        </select>
        <p style="font-size: 0.75rem; color: #64748b;">Instantly switch icons and tab titles to stay hidden.</p>
      </div>

      <!-- Custom Cloak -->
      <div class="card">
        <h3>Manual Cloak</h3>
        <input type="text" id="custom-title" class="input-style" placeholder="New tab title...">
        <input type="text" id="custom-icon" class="input-style" placeholder="Favicon URL...">
        <button class="proxy-button" style="width: 100%; padding: 10px;" onclick="applyCustomCloak()">Apply</button>
      </div>
    </div>
</div>

<script src="/baremux/index.js"></script>
<script src="/scram/scramjet.all.js"></script>

<script>
  const presets = {
      google: { title: 'Google', icon: 'https://www.google.com/favicon.ico' },
      classroom: { title: 'Classes', icon: 'https://ssl.gstatic.com/classroom/favicon.png' },
      drive: { title: 'My Drive - Google Drive', icon: 'https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png' },
      canvas: { title: 'Dashboard', icon: 'https://du11hjcvhe62z.cloudfront.net/assets/favicon.ico' },
      zoom: { title: 'Join Meeting | Zoom', icon: 'https://st1.zoom.us/zoom.ico' }
    };

    function setTabInfo(title, icon) {
      document.title = title;
      document.getElementById('dynamic-favicon').href = icon;
      // Store in localStorage so it persists across page loads
      localStorage.setItem('cloakTitle', title);
      localStorage.setItem('cloakIcon', icon);
    }

    function applyPreset() {
      const val = document.getElementById('cloak-presets').value;
      if (presets[val]) {
        setTabInfo(presets[val].title, presets[val].icon);
      }
    }

    function applyCustomCloak() {
      const title = document.getElementById('custom-title').value;
      const icon = document.getElementById('custom-icon').value;
      if (title) setTabInfo(title, icon || 'https://www.google.com/favicon.ico');
    }

    // Persistence Logic
    window.onload = () => {
      const savedTitle = localStorage.getItem('cloakTitle');
      const savedIcon = localStorage.getItem('cloakIcon');
      if (savedTitle) setTabInfo(savedTitle, savedIcon);
    };

    // Proxy Redirect Logic
    document.getElementById('proxy-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('url-input').value;
      let url = input.trim();

      if (!url.includes('.') || url.includes(' ')) {
        url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
      } else if (!url.startsWith('http')) {
        url = 'https://' + url;
      }

      // Point this to your Scramjet/Worker endpoint
      window.location.href = `/service/${btoa(url)}`;
    });
  </script>
</body>
</html>
